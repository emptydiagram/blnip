<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Modulated Neural Grid Simulation</title>
<style>
  :root {
    /* pixel size of one lattice site when rendered */
    --cell: 15px;
  }

  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem;
  }

  #controls {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  #network {
    image-rendering: pixelated; /* crisp upscale */
    border: 1px solid #ccc;
  }
</style>
</head>
<body>
  <h2>Modulated Neural Grid Simulation</h2>

  <canvas id="network"></canvas>

  <div id="controls">
    <button id="step">Step</button>
    <button id="run">Run</button>

    <label>speed
      <input type="range" id="speed" min="1" max="60" value="20" />
    </label>

    <label>grid
      <input type="number" id="size" min="10" max="150" value="70" />
    </label>

    <label>init
      <select id="init">
        <option value="random">Random</option>
        <option value="center">Center spike</option>
        <option value="top-left">Top left spike</option>
        <option value="top-right">Top right spike</option>
        <option value="bot-left">Bottom left spike</option>
        <option value="bot-right">Bottom right spike</option>
        <option value="five-points">Five points</option>
      </select>
    </label>

    <label>source
      <select id="source">
        <option value="center">Center</option>
        <option value="tl">Top‑left</option>
        <option value="tr">Top‑right</option>
        <option value="bl">Bottom‑left</option>
        <option value="br">Bottom‑right</option>
      </select>
    </label>
    <button id="trigger">Add&nbsp;source</button>

    <button id="reset">Reset</button>
  </div>

<script>
(() => {
  // ---------- configuration ---------- //
  let DEFAULT_LATTICE_SIZE = 70;
  let size = DEFAULT_LATTICE_SIZE;
  const g  = 0.08;               // damping‑like modulation
  const f  = 0.25;               // modulation on Δ ("fatigue")
  const c2 = 0.15;               // coupling strength c²

  // Per‑node state arrays (flat index = y * size + x)
  let A = [],    // activation(t )
      Aprev = [],// activation(t‑1)
      Δ = [],    // Δ(t )
      Δprev = []; // Δ(t‑1)

  // Timing
  let running       = false,
      frameInterval = 1000 / 20, // ms – updated from slider
      lastTime      = 0;

  const canvas = document.getElementById('network');
  const ctx     = canvas.getContext('2d');

  // ---------- helpers ---------- //
  function index(x, y) { return y * size + x; }

  // 4‑connected neighbourhood without wrapping
  function neighbours4(x, y) {
    const out = [];
    if (y > 0)           out.push(index(x, y - 1));
    if (y < size - 1)    out.push(index(x, y + 1));
    if (x > 0)           out.push(index(x - 1, y));
    if (x < size - 1)    out.push(index(x + 1, y));
    return out;
  }

  // --- initialization strategies --- //
  function buildInitialA(strategy) {
    const arr = new Array(size * size).fill(0);
    if (strategy === 'random') {
      for (let i = 0; i < arr.length; i++) arr[i] = Math.random() * 2 - 1;
    } else if (strategy === 'center') {
      placeSource('center', arr);
    } else if (strategy === 'top-left') {
      placeSource('tl', arr);
    } else if (strategy === 'top-right') {
      placeSource('tr', arr);
    } else if (strategy === 'bot-left') {
      placeSource('bl', arr);
    } else if (strategy === 'bot-right') {
      placeSource('br', arr);
    } else if (strategy === 'five-points') {
      placeSource('center', arr);
      placeSource('tl', arr);
      placeSource('tr', arr);
      placeSource('bl', arr);
      placeSource('br', arr);
    }
    return arr;
  }

  // place a point‑source (activation = 1) into grid or supplied array
  function placeSource(kind, targetArr = A) {
    let x, y;
    switch (kind) {
      case 'center': x = Math.floor(size / 2); y = Math.floor(size / 2); break;
      case 'tl':     x = 0;             y = 0;              break;
      case 'tr':     x = size - 1;      y = 0;              break;
      case 'bl':     x = 0;             y = size - 1;       break;
      case 'br':     x = size - 1;      y = size - 1;       break;
      default: return;
    }
    targetArr[index(x, y)] = 1;
  }

  function initGrid() {
    size = parseInt(document.getElementById('size').value) || DEFAULT_LATTICE_SIZE;
    const strategy = document.getElementById('init').value;

    A      = buildInitialA(strategy);
    Δ      = new Array(size * size).fill(0);
    Aprev  = A.slice();
    Δprev  = Δ.slice();

    const px = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell'));
    canvas.width = canvas.height = size * px;
    draw();
  }

  function step() {
    // swap buffers
    [A, Aprev]   = [Aprev, A];
    [Δ, Δprev]   = [Δprev, Δ];

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i   = index(x, y);
        const nbr = neighbours4(x, y);

        // 1. Δ′(t)
        let sumDiff = 0;
        for (const j of nbr) sumDiff += (Aprev[j] - Aprev[i]);
        const Δprime = sumDiff / nbr.length;

        // 2. Δ(t)
        Δ[i] = Δprev[i] + c2 * Δprime;

        // 3‑5. A(t)
        const inner = Δprev[i] + (c2 / nbr.length) * sumDiff;
        const mod   = inner / (1 + f);
        A[i] = (Aprev[i] + mod) / (1 + g);
      }
    }
    draw();
  }

  function draw() {
    const px = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell'));
    const img = ctx.createImageData(size, size);

    for (let i = 0; i < A.length; i++) {
      const v     = Math.max(-1, Math.min(1, A[i]));
      const shade = ((v + 1) / 2) * 255;
      img.data[i * 4 + 0] = shade;
      img.data[i * 4 + 1] = shade;
      img.data[i * 4 + 2] = shade;
      img.data[i * 4 + 3] = 255;
    }

    ctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(canvas, 0, 0, size, size, 0, 0, size * px, size * px);
  }

  // ---------- UI ---------- //
  document.getElementById('step').onclick    = step;
  document.getElementById('run').onclick     = () => {
    running = !running;
    document.getElementById('run').textContent = running ? 'Pause' : 'Run';
  };
  document.getElementById('reset').onclick   = initGrid;
  document.getElementById('speed').oninput   = e => {
    frameInterval = 1000 / (+e.target.value || 20);
  };

  // trigger point source interactively
  document.getElementById('trigger').onclick = () => {
    placeSource(document.getElementById('source').value);
    draw();
  };

  function loop(ts) {
    if (running && ts - lastTime >= frameInterval) {
      step();
      lastTime = ts;
    }
    requestAnimationFrame(loop);
  }

  // boot
  initGrid();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
