<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>"Beyond-local neural information processing", algorithm with modulation</title>
<style>
  :root {
    /* pixel size of one lattice site when rendered */
    --cell: 20px;
  }

  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem;
  }

  #controls, #params {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  #network {
    image-rendering: pixelated; /* crisp upscale */
    border: 1px solid #ccc;
  }
</style>
</head>
<body>
  <h2>BLNIP Neural Grid Simulation</h2>

  <!-- parameter controls row -->
  <div id="params">
    <label>grid
      <input type="number" id="size" min="10" max="150" value="50" />
    </label>

    <label>cell size
      <input type="number" id="cell" min="4" max="30" value="16" />
    </label>

    <label>c² <input type="number" id="c2" min="0" step="0.01" value="0.2" /></label>
    <label>f <input type="number" id="f" min="0" step="0.01" value="0.08" /></label>
    <label>g <input type="number" id="g" min="0" step="0.01" value="0.05" /></label>
  </div>

  <!-- main controls row -->
  <div id="controls">
    <button id="step">Step</button>
    <button id="run">Run</button>

    <label>speed
      <input type="range" id="speed" min="1" max="50" value="20" />
    </label>

    <label>init
      <select id="init">
        <option value="random">Random</option>
        <option value="center">Center spike</option>
        <option value="top-left">Top left spike</option>
        <option value="top-right">Top right spike</option>
        <option value="bot-left">Bottom left spike</option>
        <option value="bot-right">Bottom right spike</option>
        <option value="five-points">Five points</option>
      </select>
    </label>

    <label>source
      <select id="source">
        <option value="center">Center</option>
        <option value="tl">Top‑left</option>
        <option value="tr">Top‑right</option>
        <option value="bl">Bottom‑left</option>
        <option value="br">Bottom‑right</option>
      </select>
    </label>
    <button id="trigger">Add&nbsp;source</button>

    <button id="reset">Reset</button>
  </div>


  <canvas id="network"></canvas>

<script>
(() => {
  // ---------- configuration ---------- //
  const DEFAULT_LATTICE_SIZE = 50;
  const DEFAULT_SPEED        = 20;
  const DEFAULT_CELL_PX      = 16;

  let size = DEFAULT_LATTICE_SIZE;

  // Per‑node state buffers (flat index = y * size + x)
  let A = [], Aprev = [], Δ = [], Δprev = [];

  // Timing
  let running = false,
      frameInterval = 1000 / DEFAULT_SPEED,
      lastTime      = 0;

  const canvas = document.getElementById('network');
  const ctx    = canvas.getContext('2d');

  // DOM refs
  const speedInput = document.getElementById('speed');
  const sizeInput  = document.getElementById('size');
  const cellInput  = document.getElementById('cell');
  const gInput     = document.getElementById('g');
  const fInput     = document.getElementById('f');
  const c2Input    = document.getElementById('c2');

  // ---------- helpers ---------- //
  const index = (x, y) => y * size + x;

  // 4‑connected neighbours w/o wrapping
  const neighbours4 = (x, y) => {
    const out = [];
    if (y > 0)        out.push(index(x, y - 1));
    if (y < size - 1) out.push(index(x, y + 1));
    if (x > 0)        out.push(index(x - 1, y));
    if (x < size - 1) out.push(index(x + 1, y));
    return out;
  };

  // -------- initialisation -------- //
  function placeSource(kind, arr = A) {
    let x, y;
    switch (kind) {
      case 'center': x = Math.floor(size / 2); y = Math.floor(size / 2); break;
      case 'tl':     x = 0;           y = 0;            break;
      case 'tr':     x = size - 1;    y = 0;            break;
      case 'bl':     x = 0;           y = size - 1;     break;
      case 'br':     x = size - 1;    y = size - 1;     break;
      default: return;
    }
    arr[index(x, y)] = 1;
  }

  function buildInitialA(strategy) {
    const arr = new Array(size * size).fill(0);
    switch (strategy) {
      case 'random':
        for (let i = 0; i < arr.length; i++) arr[i] = Math.random() * 2 - 1;
        break;
      case 'center':       placeSource('center', arr); break;
      case 'top-left':     placeSource('tl', arr);     break;
      case 'top-right':    placeSource('tr', arr);     break;
      case 'bot-left':     placeSource('bl', arr);     break;
      case 'bot-right':    placeSource('br', arr);     break;
      case 'five-points':  ['center','tl','tr','bl','br'].forEach(k=>placeSource(k,arr)); break;
    }
    return arr;
  }

  function step() {
    const g  = +gInput.value;
    const f  = +fInput.value;
    const c2 = +c2Input.value;

    // swap buffers
    [A, Aprev] = [Aprev, A];
    [Δ, Δprev] = [Δprev, Δ];

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i   = index(x, y);
        const nbr = neighbours4(x, y);
        const k   = nbr.length;

        // 1. Δ′(t) ("grid Laplacian"), avg (i -> j activation delta)
        let sumDiff = 0;
        for (const j of nbr) sumDiff += (Aprev[j] - Aprev[i]);
        const Δprime = sumDiff / k;

        // 2. Δ(t)
        Δ[i] = (Δprev[i] + c2 * Δprime);

        // 3‑5. A(t)
        A[i] = (Aprev[i] + Δ[i] / (1 + f)) / (1 + g);
      }
    }
    draw();
  }

  function draw() {
    const px = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell'));
    const img = ctx.createImageData(size, size);

    for (let i = 0; i < A.length; i++) {
      const v = Math.max(-1, Math.min(1, A[i]));
      const s = ((v + 1) / 2) * 255;
      const k = i * 4;
      img.data[k] = img.data[k+1] = img.data[k+2] = s;
      img.data[k+3] = 255;
    }

    ctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(canvas, 0, 0, size, size, 0, 0, size * px, size * px);
  }

  document.getElementById('step').onclick  = step;
  document.getElementById('run').onclick   = () => {
    running = !running;
    document.getElementById('run').textContent = running ? 'Pause' : 'Run';
  };
  document.getElementById('reset').onclick = initGrid;

  speedInput.oninput = e => {
    frameInterval = 1000 / (+e.target.value || DEFAULT_SPEED);
  };

  cellInput.oninput = e => {
    const px = +e.target.value || DEFAULT_CELL_PX;
    document.documentElement.style.setProperty('--cell', `${px}px`);
    // resize canvas to new pixel size and redraw current state
    canvas.width = canvas.height = size * px;
    draw();
  };

  document.getElementById('trigger').onclick = () => {
    placeSource(document.getElementById('source').value);
    draw();
  };

  // -------- init -------- //
  function initGrid() {
    size = +sizeInput.value || DEFAULT_LATTICE_SIZE;
    const strategy = document.getElementById('init').value;

    A     = buildInitialA(strategy);
    Δ     = new Array(size * size).fill(0);
    Aprev = A.slice();
    Δprev = Δ.slice();

    // respect current cell px
    const px = +cellInput.value || DEFAULT_CELL_PX;
    document.documentElement.style.setProperty('--cell', `${px}px`);
    canvas.width = canvas.height = size * px;
    draw();
  }

  function loop(ts) {
    if (running && ts - lastTime >= frameInterval) {
      step();
      lastTime = ts;
    }
    requestAnimationFrame(loop);
  }

  initGrid();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
